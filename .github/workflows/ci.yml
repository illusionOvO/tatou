name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov hypothesis

      # 1) 单元测试 + 覆盖率 gate
      - name: Run pytest with branch coverage
        run: |
          pytest server/unitest \
            --cov=server/src.server \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-fail-under=75

      # 2) Fuzz 测试（轮数缩小一点，CI 里控制时间）
      - name: Run fuzz tests
        run: |
          pytest server/unitest/test_fuzz_api_random.py -s
        env:
          FUZZ_ROUNDS: "60"   # 如果你代码支持读环境变量可用，不支持也没关系

      # 3) 上传 coverage HTML 报告
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov

      # 4) 上传 fuzz 报告
      - name: Upload fuzz report
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-report
          path: |
            fuzz_report.html
            fuzz_report.json
            fuzz_report.csv
